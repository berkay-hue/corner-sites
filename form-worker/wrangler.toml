name = "corner-forms"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Sitelerdeki tüm formlar buraya POST eder (/submit). Her gönderim önce D1'e yazılır,
# sonra e-posta ile iletilir. E-posta gönderilemezse (binding yoksa/hata) saatlik cron tekrar dener.
[triggers]
# İkinci ifade yayın kuyruğu (src/publish.js publishTick): her 5 dakikada bir. PUBLISH_ENABLED = "0" iken bu tetik 0 D1
# sorgusu ve 0 istekle hemen döner; saatlik cron ("17 * * * *") ondan bağımsız ve aynen çalışır. Ücretsiz planda hesap
# başına cron sayısı sınırı deploy öncesi doğrulanmalı; sınır aşılırsa yalnız "*/5 * * * *" silinir (kod bunu bekler).
crons = ["17 * * * *", "*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "corner-forms"
database_id = "880d623b-a8c1-4c09-84eb-acf9b830005d"

[vars]
MAIL_TO = "berkay@saascorner.co"
# Gönderen: Email Routing açık bir alan adı olmalı. cornergroup.co'da MX yok, Google Workspace bozulmaz.
MAIL_FROM = "form@cornergroup.co"
RAKIP_START = "https://smcorner.app.n8n.cloud/webhook/rakip-analizi-pro-v5"
RAKIP_STATUS = "https://smcorner.app.n8n.cloud/webhook/rakip-analizi-status"
ALLOWED_HOSTS ="saascorner.co,cornergroup.co,socialmediacorner.co,salescorner.co,yalcinberkay.com.tr,brandcorner.co,wishceo.com,app.socialmediacorner.co"
# brandcorner.co şifre sıfırlama e-postaları (src/smtp.js): bu Google Workspace hesabından Gmail SMTP ile, ücretsiz.
# Hesabın uygulama şifresi secret olarak girilir: wrangler secret put SMTP_PASS --name corner-forms
SMTP_USER = "berkay@saascorner.co"
# brandcorner sosyal metrikleri (src/metrics.js). "1": gerçek veri D1'den okunur; önce migrations/0001_metrics.sql uygulanmalı.
# "0": D1 metrik tablolarına dokunulmaz, panel "örnek" etiketli örnek veri gösterir. D1 0001–0007, 0009 ve 0010 uygulandı (25 Eki 2026).
METRICS_ENABLED = "1"
# brandcorner gönderi ölçümleri (GET/POST /app/posts*). "1": D1'e yazılır; önce migrations/0006_posts.sql uygulanmalı.
# "0": uçlar 404 döner, panel kaydı tarayıcıda tutar. D1 0006 uygulandı (19 Eki 2026). Gönderi başına kitle (audience
# sütunu) için migrations/0010_post_audience.sql bu kodun deploy'undan ÖNCE uygulanmalı; yoksa uçlar 503 not_ready döner.
# 0010 uygulandı (25 Eki 2026).
POSTS_ENABLED = "1"
# YouTube kitle dağılımı (yaş, cinsiyet, ülke). "1": bağlanırken yt-analytics.readonly izni de istenir. GCP brand-corner
# projesinde YouTube Analytics API açık ve izin OAuth onay ekranında (24 Eki 2026); mevcut bağlantılar yeniden bağlanınca veri alır.
# "0": yalnız youtube.readonly; kitle raporu 403 döner, panel "yeniden bağlanınca" der.
YT_ANALYTICS = "1"
# app.socialmediacorner.co taslak üretimi (src/generate.js, POST /gen/*). "1" yapmadan önce
# migrations/0014_gen.sql uygulanmalı; tablo yoksa 503 not_ready. Gizli değerler `wrangler secret put` ile girilir
# (değer burada yok): ANTHROPIC_API_KEY, GEN_SALT, TURNSTILE_SECRET; biri eksikse de 503 not_ready.
# GEN_MODEL Berkay'ın kararı, A2-3 ölçümünden sonra kesinleşir. app.socialmediacorner.co ALLOWED_HOSTS'ta (A3-1:
# bekleme listesi/teklif /submit'i ve not_ready yanıtının CORS'u için). A3-3: 23.11 Berkay onayıyla "1" (istem kuralları
# A2/A4 önerileri gibi, limitler 3/10/300); kapatmak için "0" + wrangler deploy.
GEN_ENABLED = "1"
GEN_DAILY_CAP = "300"
GEN_PER_DAY = "3"
GEN_IP_PER_DAY = "10"
# A15: 1 = /gen/* yalnız girişli kullanıcıya (ziyaretçi 401 login_required; /gen/quota left 0); ziyaretçi hakkı GEN_PER_DAY o zaman etkisiz.
GEN_LOGIN_REQUIRED = "1"
GEN_MODEL = "claude-sonnet-5-5"
# Yayın kuyruğu (src/publish.js: /publish/* uçları ve 5 dakikalık cron). "1" yapmadan ÖNCE migrations/0016_publish.sql
# uygulanmalı. "0" iken uçlar 503 not_ready döner, cron dalı D1'e ve dış API'ye dokunmaz. PUBLISH_SITES ve
# PUBLISH_PLATFORMS virgüllü izin listeleri (ör. "brandcorner.co" ve "linkedin,instagram"); boşsa hiçbir iş kiralanmaz,
# uçlar 503 not_ready. PUBLISH_PER_RUN: bir cron turunda en çok kaç iş (kod üst sınırı 6; istek/D1 bütçesinden ayrıca
# kısılır). LinkedIn/Instagram yazma izinleri (w_member_social, instagram_business_content_publish) ayrı adımdır (A7-2).
PUBLISH_ENABLED = "0"
PUBLISH_SITES = ""
PUBLISH_PLATFORMS = ""
PUBLISH_PER_RUN = "3"
# app.socialmediacorner.co hesapları (/auth/*, /app/*; src/sites.js, A5-1). AUTH_HOSTS burada yazılmaz, varsayılan
# brandcorner.co kalır. "0": app 403 origin (bugünkü davranış). "preview": yalnız <dal>.web-smcapp.pages.dev önizlemesi.
# "1": canlı app.socialmediacorner.co da eklenir (A13'te açıldı; 0015..0018 uygulanmış olmalı, etkisi wrangler deploy ile).
ACCOUNTS_ENABLED = "1"
# A14 otomatik blog yazarı (src/cms.js: /app/cms*, /oauth/cms/<p>/callback, */5 cron'da publishTick'ten sonra cmsTick).
# 0019_cms.sql uygulanmadan önce de güvenli: tablo yoksa uçlar 503 not_ready, cron sessiz. "0" iken uçlar 503 ve cron 0 D1.
CMS_ENABLED = "1"

# cornergroup.co'da Email Routing açık, berkay@saascorner.co doğrulanmış hedef adres
[[send_email]]
name = "MAIL"
destination_address = "berkay@saascorner.co"

