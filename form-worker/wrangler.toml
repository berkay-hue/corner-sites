name = "corner-forms"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Sitelerdeki tüm formlar buraya POST eder (/submit). Her gönderim önce D1'e yazılır,
# sonra e-posta ile iletilir. E-posta gönderilemezse (binding yoksa/hata) saatlik cron tekrar dener.
[triggers]
crons = ["17 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "corner-forms"
database_id = "880d623b-a8c1-4c09-84eb-acf9b830005d"

[vars]
MAIL_TO = "berkay@saascorner.co"
# Gönderen: Email Routing açık bir alan adı olmalı. cornergroup.co'da MX yok, Google Workspace bozulmaz.
MAIL_FROM = "form@cornergroup.co"
RAKIP_START = "https://smcorner.app.n8n.cloud/webhook/rakip-analizi-pro-v5"
RAKIP_STATUS = "https://smcorner.app.n8n.cloud/webhook/rakip-analizi-status"
ALLOWED_HOSTS ="saascorner.co,cornergroup.co,socialmediacorner.co,salescorner.co,yalcinberkay.com.tr,brandcorner.co,wishceo.com"
# brandcorner.co şifre sıfırlama e-postaları (src/smtp.js): bu Google Workspace hesabından Gmail SMTP ile, ücretsiz.
# Hesabın uygulama şifresi secret olarak girilir: wrangler secret put SMTP_PASS --name corner-forms
SMTP_USER = "berkay@saascorner.co"
# brandcorner sosyal metrikleri (src/metrics.js). "1": gerçek veri D1'den okunur; önce migrations/0001_metrics.sql uygulanmalı.
# "0": D1 metrik tablolarına dokunulmaz, panel "örnek" etiketli örnek veri gösterir. D1 0001–0007 ve 0009 uygulandı (24 Eki 2026).
METRICS_ENABLED = "1"
# brandcorner gönderi ölçümleri (GET/POST /app/posts*). "1": D1'e yazılır; önce migrations/0006_posts.sql uygulanmalı.
# "0": uçlar 404 döner, panel kaydı tarayıcıda tutar. D1 0006 uygulandı (19 Eki 2026).
POSTS_ENABLED = "1"
# YouTube kitle dağılımı (yaş, cinsiyet, ülke). "1": bağlanırken yt-analytics.readonly izni de istenir. GCP brand-corner
# projesinde YouTube Analytics API açık ve izin OAuth onay ekranında (24 Eki 2026); mevcut bağlantılar yeniden bağlanınca veri alır.
# "0": yalnız youtube.readonly; kitle raporu 403 döner, panel "yeniden bağlanınca" der.
YT_ANALYTICS = "1"

# cornergroup.co'da Email Routing açık, berkay@saascorner.co doğrulanmış hedef adres
[[send_email]]
name = "MAIL"
destination_address = "berkay@saascorner.co"

