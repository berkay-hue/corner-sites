# content/<host>/blog altına yeni yazı gelince (blog-worker commit'i ya da elle) siteyi build edip Cloudflare Pages'e yükler.
# Secret'lar: CLOUDFLARE_API_TOKEN (Pages: Edit), CLOUDFLARE_ACCOUNT_ID
name: blog-deploy
on:
  push:
    branches: [main]
    paths: ["content/**", "templates/**", "tools/**", "sites/**"]
  workflow_dispatch:
    inputs:
      host: { description: "Site (örn. cornergroup.co)", required: true, default: "cornergroup.co" }
concurrency: { group: "blog-deploy-${{ inputs.host || github.ref }}", cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: tools/package-lock.json }
      - run: npm ci
        working-directory: tools
      - name: Değişen siteler
        id: hosts
        env: { BEFORE: "${{ github.event.before }}" }
        run: |
          if [ -n "${{ inputs.host }}" ]; then echo "list=${{ inputs.host }}" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Push birden çok commit getirebilir: aralık before..sha. before sıfırsa (yeni dal) ya da geçmişte yoksa (force push) HEAD~1
          base=HEAD~1
          if [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base=$BEFORE; fi
          changed=$(git diff --name-only "$base" "$GITHUB_SHA")
          # tools/ ve templates/ build'i etkiler: bütün siteler yeniden yüklenir
          if echo "$changed" | grep -qE '^(tools|templates)/'; then
            list=$(ls -d sites/*/ | cut -d/ -f2 | tr '\n' ' ')
          else
            list=$(echo "$changed" | grep -E '^(content|sites)/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          fi
          echo "base=$base list=$list"
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: Build + deploy
        if: steps.hosts.outputs.list != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for host in ${{ steps.hosts.outputs.list }}; do
            [ -d "sites/$host" ] || continue
            if [ -d "content/$host/blog" ]; then node tools/build-blog.mjs build "$host"; fi
            node tools/dist.mjs "$host"
            (cd tools && npx wrangler pages deploy "../dist/$host" --project-name "web-${host%%.*}" --branch main --commit-dirty=true)
          done
