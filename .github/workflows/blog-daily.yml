# Günlük blog yazısı: tools/blog-daily.mjs yazıyı üretir, burada commit edilir ve blog-deploy tetiklenir.
# Saat başından 17 dk sonra (yoğun saat başı cron'ları düşüyor). 07 UTC = 10:00 TR saascorner, 08 = socialmediacorner, 09 = cornergroup, 10 = yalcinberkay (EN), 11 = salescorner, 12 = yalcinberkay /tr (TR, ayrı konu), 13 = wishceo (16:00 TR), brandcorner şimdilik kapalı (hour: null; Berkay bekletiyor) (wrangler.toml SITES "hour"). Kural: her site her gün yazı.
# Secret'lar: ANTHROPIC_API_KEY, PEXELS_API_KEY, (opsiyonel) TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
name: blog-daily
on:
  schedule:
    - cron: "17 7 * * *"
    - cron: "17 8 * * *"
    - cron: "17 9 * * *"
    - cron: "17 10 * * *"
    - cron: "17 11 * * *"
    - cron: "17 12 * * *"
    - cron: "17 13 * * *"
    # Telafi: GitHub saat başı cron'larını sık düşürüyor/geciktiriyor; bugün yazısı olmayan siteler 18:43 TR'de yazılır
    - cron: "43 15 * * *"
  workflow_dispatch:
    inputs:
      site: { description: "Site(ler), virgülle (örn. saascorner.co,salescorner.co)", required: true, default: "saascorner.co" }
      dry: { description: "Önizleme (commit etmez)", type: boolean, default: false }
permissions: { contents: write, actions: write }
concurrency: { group: blog-daily, cancel-in-progress: false }
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Yazı üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE: ${{ github.event.schedule }}
          SITE: ${{ inputs.site }}
          DRY: ${{ inputs.dry }}
        run: |
          if [ -n "$SITE" ]; then
            node tools/blog-daily.mjs --site "$SITE" $([ "$DRY" = "true" ] && echo --dry)
          elif [ "$SCHEDULE" = "43 15 * * *" ]; then
            node tools/blog-daily.mjs --catchup
          else
            # Gecikmeli başlasa da saati cron satırından al
            node tools/blog-daily.mjs --hour "$(echo "$SCHEDULE" | cut -d' ' -f2)"
          fi
      - name: Commit + deploy
        if: always() && inputs.dry != true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # pull --rebase de commit yazar; kimlik tüm git komutları için gerekli
          git config user.name "Corner Blog Bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add content
          git diff --cached --quiet && { echo "Yeni yazı yok"; exit 0; }
          hosts=$(git diff --cached --name-only | cut -d/ -f2 | sort -u)
          git commit -q -m "blog: $(git diff --cached --name-only | xargs -n1 basename | sed 's/\.md$//' | paste -sd, -)"
          # main eşzamanlı ilerleyebilir: 5 deneme, hepsi düşerse adım kırmızı olur
          for i in 1 2 3 4 5; do
            git pull -q --rebase && git push -q && break
            [ "$i" = 5 ] && exit 1; sleep $((i * 5))
          done
          # GITHUB_TOKEN push'u başka workflow tetiklemez; deploy elle tetiklenir
          for h in $hosts; do gh workflow run blog-deploy.yml -f host="$h"; done
