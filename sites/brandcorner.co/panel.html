:root[data-theme="dark"]{--bg:#0e1018;--surface:#161925;--surface-2:#1d2130;--line:#272c3d;--line-strong:#383e55;--text:#e9ebf3;--muted:#a3a9bc;--faint:#7d8399;

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Inter",system-ui,-apple-system,sans-serif}
a{color:inherit}img{max-width:100%;display:block}[hidden]{display:none!important}

.wrap{max-width:1120px;margin:0 auto;padding:0 32px}
h1,h2,h3{font-family:"Poppins","Inter",system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;line-height:1.25}h1:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Kabuk: masaüstünde sol menü, mobilde üst çubuk + alt sekmeler */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:22px 16px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}

.acct{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface-2);min-width:0}

.main-col{min-width:0;display:flex;flex-direction:column}
.mtop{display:none}
.main{flex:1;padding:28px 32px 56px}.wrapw{max-width:1120px;margin:0 auto;min-width:0}

.stat.go{display:flex;flex-direction:column;text-decoration:none;transition:border-color .15s,box-shadow .15s,transform .15s}.stat.go .k{display:flex;align-items:center;justify-content:space-between;gap:8px}.stat.go .k span{min-width:0}.stat.go .k .i{width:16px;height:16px;color:var(--faint);transition:transform .15s,color .15s}
.stat.go:hover{border-color:var(--line-strong);box-shadow:0 4px 14px rgba(16,24,40,.07);transform:translateY(-1px)}.stat.go:hover .k .i,.stat.go:focus-visible .k .i{color:var(--accent);transform:translateX(3px)}.stat .sub{margin-top:2px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-spot]{scroll-margin-top:16px;outline:2px solid transparent;outline-offset:6px;transition:outline-color .9s ease-out}.lane[data-spot]{outline-offset:2px}.apps-sec[data-spot]{border-radius:6px}.spot{outline-color:var(--accent);transition:none}[data-spot] > h2:focus,[data-spot] > h3:focus{outline:none}

.ic{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center}.ic.warn{background:var(--warn-soft);color:var(--warn)}.ic.info{background:var(--info-soft);color:var(--info)}.ic.danger{background:var(--danger-soft);color:var(--danger)}.ic.accent{background:var(--accent-soft);color:var(--accent-text)}.ic.ok{background:var(--ok-soft);color:var(--ok)}

.nf{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}.inbox.nf li{padding:0;flex-wrap:nowrap}.nf .nfa{display:flex;align-items:center;gap:12px;min-height:44px;padding:12px 20px;flex:1;min-width:0;color:inherit;text-decoration:none}.nf a.nfa:hover{background:var(--surface-2)}.nf li.un .tx b{font-weight:700}.nf .dot{width:10px;height:10px;flex:none;border-radius:50%;background:var(--accent)}

.cb.none{color:var(--muted);text-align:center;padding:28px 20px}

.pct{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.pct b{color:var(--text);font-weight:600}
.checklist{list-style:none;margin:14px 0 16px;padding:0;display:grid;gap:8px}.checklist li{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}

.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:40}

.head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}.head>div{min-width:0}
.list{display:grid;gap:12px}

.empty{text-align:center;color:var(--muted);padding:36px 20px}.empty p{margin:0 0 14px}.empty p:last-child{margin:0}

.nsk{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px}.nsk .sk-c{width:18px;height:18px;border-radius:5px}.tabbar .nsk{flex-direction:column;justify-content:center;gap:7px;min-height:52px;padding:4px 2px}.tabbar .nsk .sk{height:8px}.tabbar .nsk .sk-c{width:22px;height:22px}
