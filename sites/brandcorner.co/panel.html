*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Inter",system-ui,-apple-system,sans-serif}
a{color:inherit}img{max-width:100%;display:block}[hidden]{display:none!important}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px}

/* Kabuk: masaüstünde sol menü, mobilde üst çubuk + alt sekmeler */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:22px 16px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}

.mtop{display:none}
.main{flex:1;padding:28px 32px 56px}.wrapw{max-width:1120px;margin:0 auto;min-width:0}

.stat .v.na{font:500 15px/1.4 "Inter",sans-serif;color:var(--faint);margin-top:10px}

.stat.go{display:flex;flex-direction:column;text-decoration:none;transition:border-color .15s,box-shadow .15s,transform .15s}.stat.go .k{display:flex;align-items:center;justify-content:space-between;gap:8px}.stat.go .k span{min-width:0}.stat.go .k .i{width:16px;height:16px;color:var(--faint);transition:transform .15s,color .15s}

[data-spot]{scroll-margin-top:16px;outline:2px solid transparent;outline-offset:6px;transition:outline-color .9s ease-out}.lane[data-spot]{outline-offset:2px}.apps-sec[data-spot]{border-radius:6px}.spot{outline-color:var(--accent);transition:none}[data-spot] > h2:focus,[data-spot] > h3:focus{outline:none}

.ov{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}.ov>div{display:grid;gap:16px;min-width:0}

.tx{flex:1;min-width:0;display:flex;flex-direction:column}.tx b{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}.tx span{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.nfhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px}.nfhead .meta{margin:0}
.nf{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}.inbox.nf li{padding:0;flex-wrap:nowrap}.nf .nfa{display:flex;align-items:center;gap:12px;min-height:44px;padding:12px 20px;flex:1;min-width:0;color:inherit;text-decoration:none}.nf a.nfa:hover{background:var(--surface-2)}.nf li.un .tx b{font-weight:700}.nf .dot{width:10px;height:10px;flex:none;border-radius:50%;background:var(--accent)}
.ierr{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--danger);font-size:14px}.ierr span{flex:1 1 200px}
.cb.none{color:var(--muted);text-align:center;padding:28px 20px}

/* Mobil menü sayfası (ayarlar, yardım, çıkış) */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:16px 16px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:0 auto 8px}

.head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}.head>div{min-width:0}
.list{display:grid;gap:12px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:start}
.lane{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-card);padding:10px;min-width:0}
.lh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;margin:2px 4px 10px}.lh .n{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 9px}

.lane .none{font-size:13.5px;color:var(--muted);margin:4px 4px 6px}

.wrapw .bhd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin:30px 0 12px}.wrapw .bhd h2{margin:0}
.dens{display:inline-flex;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-ctl)}.dens button{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:0;border-radius:7px;background:none;color:var(--muted);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}.dens button:hover{color:var(--text)}.dens button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(16,24,40,.08)}.dens .i{width:16px;height:16px}
.dense .lc{gap:8px;grid-template-columns:minmax(0,1fr)}.dense .item{padding:10px 12px;min-width:0}.dense .item h3{font-size:15px}.dense .item .meta{margin-top:2px;font-size:13px}.dense .item .prose.sm,.dense .item .chips,.dense .item .handles,.dense .item .amets,.dense .item .info,.dense .item .meta .up{display:none}
.dense .item .quote{margin-top:8px}.dense .item .quote .ql{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.dense .item .quote .prose{font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.dense .item .link{margin-top:6px;flex-wrap:nowrap;gap:6px}.dense .item .link span{flex:none}.dense .item .link a{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dense .item .row-b{margin-top:8px}

.quote.rev{border-left-color:var(--warn)}
.item h3{font-size:16.5px;margin:0;overflow-wrap:anywhere}.item h3 a{text-decoration:none}.item h3 a:hover{color:var(--accent-text)}
.meta{color:var(--muted);font-size:13.5px;margin:6px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}.chip{font-size:12.5px;line-height:1.5;padding:2px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}

.badge{display:inline-block;font-size:12px;font-weight:600;line-height:1.6;padding:1px 9px;border-radius:999px;white-space:nowrap;background:var(--accent-soft);color:var(--accent-text)}
.b-open,.b-approved{background:var(--ok-soft);color:var(--ok)}.b-closed,.b-rejected,.b-declined{background:var(--slate-soft);color:var(--slate)}
.b-pending,.b-revision{background:var(--warn-soft);color:var(--warn)}.b-invited,.b-submitted{background:var(--info-soft);color:var(--info)}.b-soon{background:var(--accent-soft);color:var(--accent-text)}
.match{font-weight:600;color:var(--accent-text)}

.empty>p{max-width:52ch;margin-left:auto;margin-right:auto}.empty .es-t{font-size:17px;color:var(--text);margin:0 0 6px}.empty .es-cta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.empty.sm{padding:28px 20px}
.es-ic{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);box-shadow:0 0 0 6px var(--surface),0 0 0 7px var(--line)}.es-ic .i{width:26px;height:26px}.es-ic.sm{width:40px;height:40px;box-shadow:none}.es-ic.sm .i{width:20px;height:20px}.es-ic.ok{background:var(--ok-soft);color:var(--ok)}.empty.sm .es-ic{margin-bottom:12px}
