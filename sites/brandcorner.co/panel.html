header.top .wrap{display:flex;align-items:center;gap:24px;height:68px}
.btn{display:inline-block;background:var(--grad);color:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:10px 18px;border-radius:10px;white-space:nowrap}

.who{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:14px;color:var(--muted);min-width:0}
.who .me{display:flex;align-items:baseline;gap:6px;min-width:0}.who b{color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}.lnk:hover{color:var(--text)}
.ghost{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 14px;font:inherit;font-weight:600;font-size:14px;color:var(--text);cursor:pointer;white-space:nowrap}.ghost:hover{border-color:#cbd5e1}.ghost:disabled{opacity:.65;cursor:default}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:36px;padding-top:32px;padding-bottom:56px;min-height:calc(100vh - 69px - 112px)}
.side nav{display:flex;flex-direction:column;gap:4px;position:sticky;top:100px}
.side a{display:block;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px}

.view{min-width:0}.view h1{font-size:28px;margin:0 0 6px;letter-spacing:-.01em;overflow-wrap:anywhere}.view h2{font-size:19px;margin:32px 0 12px}
.lead{color:var(--muted);margin:0 0 24px}.muted{color:var(--muted)}
.box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat .n{font:700 28px/1.2 "Poppins","Inter",system-ui,sans-serif}.stat .l{color:var(--muted);font-size:14px;margin-top:4px}
.steps,.soon{list-style:none;margin:0;padding:0}.steps li,.soon li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.steps li:first-child,.soon li:first-child{border-top:0;padding-top:0}.steps li:last-child,.soon li:last-child{padding-bottom:0}
.steps a{color:var(--accent);font-weight:600;text-decoration:none}.steps a:hover{text-decoration:underline}
.soon-lead{color:var(--muted);font-size:14px;margin:0 0 12px}
.head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}.head>div{min-width:0}
.list{display:grid;gap:12px}

.meta{color:var(--muted);font-size:14px;margin:6px 0 0;display:flex;flex-wrap:wrap;gap:2px 14px}

.prow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px}
