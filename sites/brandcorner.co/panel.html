<style>
:root{--bg:#f6f7fb;--surface:#fff;--surface-2:#f1f3f9;--line:#e4e7ef;--line-strong:#cfd4e2;--text:#131726;--muted:#5b6275;--faint:#80869a;
--accent:#4f46e5;--accent-hover:#4338ca;--accent-2:#7c3aed;--accent-soft:#eef0ff;--accent-text:#4338ca;
--ok:#157f3b;--ok-soft:#e7f6ec;--warn:#a15c07;--warn-soft:#fdf3e1;--info:#0b6aa2;--info-soft:#e6f3fb;--danger:#b42318;--danger-soft:#fdecea;--slate:#525b6e;--slate-soft:#eef0f4;
--r-card:12px;--r-ctl:8px;--grad:linear-gradient(90deg,var(--accent),var(--accent-2));color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1018;--surface:#161925;--surface-2:#1d2130;--line:#272c3d;--line-strong:#383e55;--text:#e9ebf3;--muted:#a3a9bc;--faint:#7d8399;
--accent:#6a63f2;--accent-hover:#7a74f5;--accent-2:#9b7bff;--accent-soft:#24254f;--accent-text:#aba6ff;
--ok:#4cc27a;--ok-soft:#13301f;--warn:#e7a446;--warn-soft:#33260f;--info:#5bb6ea;--info-soft:#102a3a;--danger:#f2756a;--danger-soft:#3a1714;--slate:#a3a9bc;--slate-soft:#232736;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1018;--surface:#161925;--surface-2:#1d2130;--line:#272c3d;--line-strong:#383e55;--text:#e9ebf3;--muted:#a3a9bc;--faint:#7d8399;
--accent:#6a63f2;--accent-hover:#7a74f5;--accent-2:#9b7bff;--accent-soft:#24254f;--accent-text:#aba6ff;
--ok:#4cc27a;--ok-soft:#13301f;--warn:#e7a446;--warn-soft:#33260f;--info:#5bb6ea;--info-soft:#102a3a;--danger:#f2756a;--danger-soft:#3a1714;--slate:#a3a9bc;--slate-soft:#232736;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Inter",system-ui,-apple-system,sans-serif}
a{color:inherit}img{max-width:100%;display:block}[hidden]{display:none!important}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px}
h1,h2,h3{font-family:"Poppins","Inter",system-ui,sans-serif;line-height:1.25}h1:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Kabuk: masaüstünde sol menü, mobilde üst çubuk + alt sekmeler */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:22px 16px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
.logo{font:700 20px/1 "Poppins","Inter",sans-serif;text-decoration:none;color:var(--text);letter-spacing:-.01em;padding:4px 8px;display:inline-flex;align-items:center;min-height:44px}.logo span{color:var(--accent)}
.acct{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface-2);min-width:0}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--grad);color:#fff;font:600 14px/1 "Inter",sans-serif}
.acct>div{min-width:0}.acct .n{font-weight:600;font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.acct .r{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.nb{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:var(--r-ctl);text-decoration:none;color:var(--muted);font:500 14.5px/1.2 "Inter",sans-serif;background:none;border:0;cursor:pointer;width:100%;text-align:left}
.nav a:hover,.nb:hover{background:var(--surface-2);color:var(--text)}
.nav a[aria-current]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.cnt{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--accent);color:#fff;font:600 12px/22px "Inter",sans-serif;text-align:center}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:12px}
.nb:disabled{opacity:.6;cursor:default}
.main-col{min-width:0;display:flex;flex-direction:column}
.mtop{display:none}
.main{flex:1;padding:28px 32px 56px}.wrapw{max-width:1120px;margin:0 auto;min-width:0}
.tabbar{display:none}
/* Sayfa başlığı ve kartlar */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin:0 0 22px}.ph>div{min-width:0}
.ph h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em;overflow-wrap:anywhere}.ph p{margin:0;color:var(--muted)}.ph .acts{display:flex;flex-wrap:wrap;gap:8px}
.wrapw>h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em;overflow-wrap:anywhere}.wrapw h2{font-size:18px;margin:30px 0 12px}
.lead{color:var(--muted);margin:0 0 24px}.muted{color:var(--muted)}
.box,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:20px}
.card{padding:0;overflow:hidden}.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}.ch h2{font-size:16px;margin:0}.ch .muted{font-size:13px}
.cb{padding:16px 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;background:var(--accent);color:#fff;text-decoration:none;font:600 14.5px/1.2 "Inter",sans-serif;padding:9px 16px;border-radius:var(--r-ctl);white-space:nowrap;border:0;cursor:pointer}
.btn:hover{background:var(--accent-hover)}button.btn:disabled{opacity:.65;cursor:default}.btn.sm{font-size:13.5px;padding:7px 12px;min-height:44px}
.btn.sec{background:var(--surface);color:var(--text);border:1px solid var(--line-strong)}.btn.sec:hover{background:var(--surface-2)}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}.lnk:hover{color:var(--text)}
.ghost{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-ctl);padding:7px 14px;min-height:40px;font:inherit;font-weight:600;font-size:14px;color:var(--text);cursor:pointer;white-space:nowrap}.ghost:hover{background:var(--surface-2)}.ghost:disabled{opacity:.65;cursor:default}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px 18px;min-width:0}.stat .k{color:var(--muted);font-size:13px}.stat .v{font:600 26px/1.25 "Poppins","Inter",sans-serif;margin-top:4px}
.stat .v.na{font:500 15px/1.4 "Inter",sans-serif;color:var(--faint);margin-top:10px}
.ov{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}.ov>div{display:grid;gap:16px;min-width:0}
.inbox{list-style:none;margin:0;padding:0}.inbox li{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line)}.inbox li:first-child{border-top:0}
.ic{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center}.ic.warn{background:var(--warn-soft);color:var(--warn)}.ic.info{background:var(--info-soft);color:var(--info)}.ic.danger{background:var(--danger-soft);color:var(--danger)}.ic.accent{background:var(--accent-soft);color:var(--accent-text)}.ic.ok{background:var(--ok-soft);color:var(--ok)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column}.tx b{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}.tx span{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.cb.none{color:var(--muted);text-align:center;padding:28px 20px}
.meter{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:6px 0 4px}.meter i{display:block;height:100%;background:var(--grad);border-radius:999px}
.pct{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.pct b{color:var(--text);font-weight:600}
.checklist{list-style:none;margin:14px 0 16px;padding:0;display:grid;gap:8px}.checklist li{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.checklist .dot{width:20px;height:20px;flex:none;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center}
.checklist li.done{color:var(--text)}.checklist li.done .dot{background:var(--ok-soft);border-color:transparent;color:var(--ok)}.checklist .dot .i{width:13px;height:13px;stroke-width:2.4}
.mets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.mets .stat{background:var(--surface-2);border:0}
.steps,.soon{list-style:none;margin:0}.soon{padding:0}.soon li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.soon li:first-child{border-top:0;padding-top:0}.soon li:last-child{padding-bottom:0}
.soon-lead{color:var(--muted);font-size:14px;margin:0 0 12px}
footer.bot{border-top:1px solid var(--line);color:var(--muted);font-size:13.5px;padding:24px 0 32px}footer.bot .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between}footer.bot nav{display:flex;flex-wrap:wrap;gap:8px 18px}footer.bot a{text-decoration:none;display:inline-flex;align-items:center;min-height:44px}footer.bot a:hover{color:var(--text)}
/* Mobil menü sayfası (ayarlar, yardım, çıkış) */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:16px 16px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:0 auto 8px}
/* Mevcut görünümler (kampanya, keşif, profil) */
.head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}.head>div{min-width:0}
.list{display:grid;gap:12px}
.item h3{font-size:16.5px;margin:0;overflow-wrap:anywhere}.item h3 a{text-decoration:none}.item h3 a:hover{color:var(--accent-text)}
.meta{color:var(--muted);font-size:13.5px;margin:6px 0 0;display:flex;flex-wrap:wrap;gap:2px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}.chip{font-size:12.5px;line-height:1.5;padding:2px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.handles{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13.5px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:600;line-height:1.6;padding:1px 9px;border-radius:999px;white-space:nowrap;background:var(--accent-soft);color:var(--accent-text)}
.b-open,.b-approved{background:var(--ok-soft);color:var(--ok)}.b-closed,.b-rejected,.b-declined{background:var(--slate-soft);color:var(--slate)}
.b-pending,.b-revision{background:var(--warn-soft);color:var(--warn)}.b-invited,.b-submitted{background:var(--info-soft);color:var(--info)}.b-soon{background:var(--accent-soft);color:var(--accent-text)}
.match{font-weight:600;color:var(--accent-text)}
.prose{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0 0}.prose.sm{font-size:14.5px;color:var(--muted)}
.quote{border-left:3px solid var(--line-strong);padding:0 0 0 12px;margin:12px 0 0}.quote .ql{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}.quote .prose{margin:0}
.link{overflow-wrap:anywhere}.link a{color:var(--accent-text)}
.info{font-size:13.5px;color:var(--muted);margin:10px 0 0}
.row-b{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 0}
.back{margin:0 0 10px;font-size:14px}.back a{color:var(--muted);text-decoration:none}.back a:hover{color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:36px 20px}.empty p{margin:0 0 14px}.empty p:last-child{margin:0}
.f label,.f legend{display:block;font-weight:600;font-size:14px;margin:0 0 6px;padding:0}
.f input:not([type=checkbox]),.f select,.f textarea{display:block;width:100%;font:inherit;font-size:16px;line-height:1.4;padding:10px 12px;margin:0 0 16px;border:1px solid var(--line-strong);border-radius:var(--r-ctl);background:var(--surface);color:var(--text)}
.f textarea{resize:vertical;min-height:96px}
.f input:focus-visible,.f select:focus-visible,.f textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.f fieldset{border:0;padding:0;margin:0 0 16px;min-width:0}
.hint{color:var(--muted);font-size:13px;font-weight:400;margin:-10px 0 16px}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}.f .checks label,.f label.check{display:flex;align-items:center;gap:8px;font-weight:400;font-size:15px;margin:0}
.f input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.prow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px}
.filter{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin:0 0 20px}.filter>div{flex:1 1 180px}.f.filter input:not([type=checkbox]),.f.filter select{margin:0}
.sub{margin:14px 0 0;padding:16px 0 0;border-top:1px solid var(--line)}
.inl{display:flex;flex-wrap:wrap;gap:8px}.f .inl input{flex:1 1 220px;width:auto;margin:0}
.msg{color:var(--danger);font-size:14px;margin:12px 0 0}.msg:empty{display:none}.ok{color:var(--ok);font-size:14px;margin:12px 0 0}.ok:empty{display:none}
.ro{color:var(--muted);font-size:14px;margin:0 0 20px;display:flex;flex-wrap:wrap;gap:4px 20px}.ro b{color:var(--text);font-weight:600}
@media(max-width:1100px){.ov{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){.app{display:block}.side{display:none}
.mtop{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;height:56px;padding:0 8px 0 12px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.mtop .me{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.main{padding:18px 16px 24px}.wrap{padding:0 16px}
.tabbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;text-decoration:none;color:var(--muted);font:500 11px/1.2 "Inter",sans-serif;padding:4px 2px;text-align:center}
.tabbar a[aria-current]{color:var(--accent-text);font-weight:600}.tabbar .i{width:22px;height:22px}
.tabbar .cnt{position:absolute;top:4px;left:calc(50% + 6px);margin:0;min-width:18px;height:18px;padding:0 5px;font-size:11px;line-height:18px}
.main-col{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.stats,.mets{grid-template-columns:repeat(2,minmax(0,1fr))}.mets .stat:last-child{grid-column:1/-1}
.btn,.btn.sm,.ghost{min-height:44px}.inbox li{padding:12px 16px;flex-wrap:wrap}.inbox .btn{margin-left:48px}
.ph h1,.wrapw>h1{font-size:22px}.box{padding:16px}.ch,.cb{padding-left:16px;padding-right:16px}.grid2{grid-template-columns:1fr}.prow{grid-template-columns:1fr 1fr}.prow>div:last-child{grid-column:1/-1}}
</style>
</head>
