/* Kabuk: masaüstünde sol menü, mobilde üst çubuk + alt sekmeler */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}

.side .foot{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:12px}
.nb:disabled{opacity:.6;cursor:default}
.main-col{min-width:0;display:flex;flex-direction:column}
.mtop{display:none}
.main{flex:1;padding:28px 32px 56px}.wrapw{max-width:1120px;margin:0 auto;min-width:0}
.tabbar{display:none}

.wrapw>h1{font-size:24px;margin:0 0 6px;letter-spacing:-.01em;overflow-wrap:anywhere}.wrapw h2{font-size:17px;margin:30px 0 12px}

.ov{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}.ov>div{display:grid;gap:16px;min-width:0}
.inbox{list-style:none;margin:0;padding:0}.inbox li{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line)}.inbox li:first-child{border-top:0}
.ic{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center}.ic.warn{background:var(--warn-soft);color:var(--warn)}.ic.info{background:var(--info-soft);color:var(--info)}.ic.danger{background:var(--danger-soft);color:var(--danger)}.ic.accent{background:var(--accent-soft);color:var(--accent-text)}.ic.ok{background:var(--ok-soft);color:var(--ok)}
