<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paylaşılan çıktı | Sales Corner</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Sales Corner ile hazırlanmış, herkese açık salt okunur çıktı.">
<link href="/_a/fr/images/yaO2oRoUboEyRi1HXwHDHwBe1Q.webp" rel="icon">
<link rel="apple-touch-icon" href="/_a/fr/images/CVipIegf1b4aKtLR23J6oqBRk.png">
<link rel="stylesheet" href="/_a/fonts.css">
<style>
:root{--bg:#0a0a0f;--fg:#e8e8ee;--mute:rgba(255,255,255,.62);--line:rgba(255,255,255,.1);--card:rgba(255,255,255,.035);--acc:#7c8cff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--acc)}
.w{max-width:780px;margin:0 auto;padding:0 16px;width:100%}
header{border-bottom:1px solid var(--line)}
header .w{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
.logo{color:var(--fg);text-decoration:none;font-weight:700;font-size:17px;letter-spacing:-.01em}
.tag{font-size:12.5px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
main{flex:1;padding:36px 0 48px}
.meta{color:var(--mute);font-size:14px;margin:0 0 6px}
h1{font-size:clamp(26px,5vw,36px);line-height:1.2;letter-spacing:-.02em;margin:0 0 24px;overflow-wrap:anywhere}
.doc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;overflow-wrap:anywhere}
.doc>:first-child{margin-top:0}.doc>:last-child{margin-bottom:0}
.doc h2{font-size:21px;line-height:1.3;margin:30px 0 10px;letter-spacing:-.01em}
.doc h3{font-size:17.5px;line-height:1.35;margin:24px 0 8px}
.doc h4{font-size:16px;margin:20px 0 6px}
.doc p{margin:0 0 14px}
.doc ul{margin:0 0 14px;padding-left:22px}
.doc li{margin:4px 0}
.doc hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.doc strong{color:#fff;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--acc);color:#0a0a0f;text-decoration:none;font-weight:600;min-height:44px;padding:10px 20px;border-radius:12px}
.btn:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:3px}
.bos{text-align:center;padding:56px 0}
.bos h1{margin-bottom:12px}
.bos p{color:var(--mute);margin:0 0 24px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:64px auto;animation:d .8s linear infinite}
@keyframes d{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
footer{border-top:1px solid var(--line);padding:22px 0;font-size:14.5px;color:var(--mute)}
footer .w{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
footer a{font-weight:600}
@media (max-width:520px){.doc{padding:18px 16px;border-radius:14px}main{padding:26px 0 36px}}
</style>
</head>
<body>
<header><div class="w"><a class="logo" href="https://salescorner.co/">Sales Corner</a><span class="tag">Salt okunur paylaşım</span></div></header>
<main><div class="w" id="ic" aria-live="polite"><div class="spin" role="status" aria-label="Yükleniyor"></div></div></main>
<footer><div class="w"><span>Sales Corner ile hazırlandı · <a href="https://app.salescorner.co/#/kayit">14 gün ücretsiz dene</a></span><span>Bu sayfa arama motorlarında listelenmez.</span></div></footer>
<script>
(function () {
  "use strict";
  var SB_URL = "https://jqllcrmwjxnuzxbzfydu.supabase.co";
  var SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxbGxjcm13anhudXp4YnpmeWR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0NzE2NzcsImV4cCI6MjExMTA0NzY3N30.kn2IDDNLcI3bjSOXlNWvx9ISHcvN9xkIezFh70xiqiw";
  var KAYIT = "https://app.salescorner.co/#/kayit";
  var MODUL = { rakip: "Rakip analizi", sekans: "Satış sekansı", seo: "SEO raporu", briefing: "Toplantı briefingi", fireflies: "Toplantı analizi", takip: "Rakip takibi" };
  var ic = document.getElementById("ic");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // Sunucu zaten maskeler; ikinci savunma olarak burada da a***@alan.com biçimine çevrilir
  function maskele(s) {
    return String(s == null ? "" : s).replace(/([A-Za-z0-9])[A-Za-z0-9._%+-]*@([A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,})/g, "$1***@$2");
  }
  // Satır içi: önce kaçışlanmış metin gelir; yalnız **kalın** ve https bağlantılar etikete dönüşür
  function kalin(t) { return t.replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>"); }
  function satir(t) {
    var re = /\[([^\]\n]{1,300})\]\((https:\/\/[^\s()]{1,2000})\)/g, out = "", son = 0, m;
    while ((m = re.exec(t))) {
      out += kalin(t.slice(son, m.index)) + '<a href="' + m[2] + '" target="_blank" rel="noopener nofollow ugc">' + kalin(m[1]) + "</a>";
      son = re.lastIndex;
    }
    return out + kalin(t.slice(son));
  }
  function md(kaynak) {
    var satirlar = esc(maskele(kaynak)).replace(/\r\n?/g, "\n").split("\n"), html = [], par = [], liste = [];
    function kapat() {
      if (par.length) { html.push("<p>" + par.map(satir).join("<br>") + "</p>"); par = []; }
      if (liste.length) { html.push("<ul>" + liste.map(function (x) { return "<li>" + satir(x) + "</li>"; }).join("") + "</ul>"); liste = []; }
    }
    satirlar.forEach(function (ham) {
      var s = ham.replace(/\s+$/, ""), m;
      if (!s.trim()) return kapat();
      if ((m = s.match(/^(#{1,4})\s+(.+)$/))) { kapat(); var n = Math.max(2, Math.min(4, m[1].length)); html.push("<h" + n + ">" + satir(m[2]) + "</h" + n + ">"); return; }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(s)) { kapat(); html.push("<hr>"); return; }
      if ((m = s.match(/^\s*[-*•]\s+(.+)$/))) { if (par.length) { var p = par; par = []; html.push("<p>" + p.map(satir).join("<br>") + "</p>"); } liste.push(m[1]); return; }
      if (liste.length) { html.push("<ul>" + liste.map(function (x) { return "<li>" + satir(x) + "</li>"; }).join("") + "</ul>"); liste = []; }
      par.push(s);
    });
    kapat();
    return html.join("\n");
  }
  function gecersiz() {
    document.title = "Bağlantı geçerli değil | Sales Corner";
    ic.innerHTML = '<div class="bos"><h1>Bu bağlantı artık geçerli değil.</h1><p>Paylaşım kapatılmış ya da bağlantı hatalı olabilir. Kendi rakip analizlerinizi, satış sekanslarınızı ve toplantı briefinglerinizi Sales Corner ile hazırlayın.</p><a class="btn" href="' + KAYIT + '">14 gün ücretsiz dene</a></div>';
  }
  function hata() {
    document.title = "Sayfa yüklenemedi | Sales Corner";
    ic.innerHTML = '<div class="bos"><h1>Sayfa şu an yüklenemedi.</h1><p>Bağlantınızı kontrol edip sayfayı yenileyin.</p><a class="btn" href="">Tekrar dene</a></div>';
  }
  function tarih(d) {
    var t = new Date(d);
    return isNaN(t) ? "" : t.toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" });
  }
  function goster(o) {
    var baslik = maskele(String(o.baslik || "").slice(0, 200)) || "Paylaşılan çıktı";
    document.title = baslik + " | Sales Corner";
    var ust = [MODUL[o.modul] || "Sales Corner çıktısı", tarih(o.olusturma)].filter(Boolean).join(" · ");
    ic.innerHTML = '<p class="meta">' + esc(ust) + "</p><h1>" + esc(baslik) + '</h1><article class="doc">' + md(o.icerik) + "</article>";
  }

  var m = location.pathname.match(/^\/r\/([A-Za-z0-9_-]{22})\/?$/) || location.hash.match(/^#\/?([A-Za-z0-9_-]{22})$/);
  if (!m) return gecersiz();
  var id = m[1];
  var ctl = typeof AbortController === "function" ? new AbortController() : null;
  var zaman = setTimeout(function () { if (ctl) ctl.abort(); }, 15000);
  fetch(SB_URL + "/rest/v1/rpc/app_cikti_genel", {
    method: "POST",
    headers: { apikey: SB_ANON, authorization: "Bearer " + SB_ANON, "content-type": "application/json", accept: "application/json" },
    body: JSON.stringify({ p_paylas_id: id }),
    signal: ctl ? ctl.signal : undefined,
    cache: "no-store",
    credentials: "omit",
    referrerPolicy: "no-referrer"
  }).then(function (r) {
    if (r.status === 400 || r.status === 404) return null;
    if (!r.ok) throw new Error("http " + r.status);
    return r.json();
  }).then(function (o) {
    clearTimeout(zaman);
    if (!o || typeof o !== "object" || typeof o.icerik !== "string") return gecersiz();
    goster(o);
  }).catch(function () { clearTimeout(zaman); hata(); });
})();
</script>
</body>
</html>
