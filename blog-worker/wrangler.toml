name = "corner-blog-writer"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Her saat başı 06-11 UTC çalışır; o saatte "hour" alanı eşleşen site yazılır (siteler aynı anda değil, sırayla).
# 07 UTC = 10:00 TR, 08 = 11:00, 09 = 12:00
[triggers]
crons = ["0 6-11 * * *"]

[vars]
# Blogu olan her site için bir kayıt. repo/branch: yazıların commit edildiği GitHub deposu (push'ta Action build + deploy yapar).
# pages: yazıda iç link verilebilecek site sayfaları. sisters: link verilebilecek kardeş siteler.
